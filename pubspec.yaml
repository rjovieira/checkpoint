name: checkpoint
description: "Cross-platform game save manager for backing up and restoring emulator saves."
publish_to: 'none'

# The version is the single source of truth for the value written into backup
# manifests (`appVersion`). Bump it here, nowhere else.
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # State management + dependency injection. Chosen for compile-safe DI,
  # test-time overrides via ProviderContainer, and AsyncValue's direct mapping
  # onto the loading/data/error UI states. See README for the full rationale.
  flutter_riverpod: ^3.0.2

  # ZIP container read/write. Extraction is implemented by hand on top of this
  # (never `extractArchiveToDisk`) so every entry passes our own validation.
  archive: ^4.0.7

  # SHA-256 for per-file backup integrity information.
  crypto: ^3.0.6

  # Platform-independent POSIX-style path manipulation.
  path: ^1.9.1

  # Locates app-private storage for the configuration document. First-party
  # Flutter plugin; the alternative was another platform-channel method.
  path_provider: ^2.1.5

  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
